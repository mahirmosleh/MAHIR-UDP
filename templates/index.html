<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHIR LW | FreeFire Level Up Bot Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #060913;
            --bg-card: rgba(13, 19, 36, 0.75);
            --bg-card-hover: rgba(19, 27, 50, 0.9);
            --border-card: rgba(0, 242, 254, 0.12);
            --border-hover: rgba(0, 242, 254, 0.4);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #7f00ff;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --accent-amber: #ffaa00;
            --text-main: #f0f4fc;
            --text-muted: #8e9bb5;
            --glass-glow: 0 4px 20px 0 rgba(0, 242, 254, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #ffffff;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(127, 0, 255, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.12) 0%, transparent 45%),
                linear-gradient(180deg, #060913 0%, #0a0e1c 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 14px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            backdrop-filter: blur(12px);
            box-shadow: var(--glass-glow);
            margin-bottom: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
            100% { box-shadow: 0 0 20px rgba(127, 0, 255, 0.4); }
        }

        .brand-text h1 {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 1px;
            white-space: nowrap; /* লেখাটি এক লাইনে রাখবে */
        }


        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: var(--accent-green);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
        }


        .pulse-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            outline: none;
            white-space: nowrap; /* টেক্সট এক লাইনে রাখতে এটি যোগ করুন */
        }


        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #040914;
            box-shadow: 0 3px 12px rgba(0, 242, 254, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.35);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-hover);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--glass-glow);
        }

        .stat-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .stat-icon.cyan { background: rgba(0, 242, 254, 0.15); color: var(--accent-cyan); }
        .stat-icon.green { background: rgba(0, 255, 136, 0.15); color: var(--accent-green); }
        .stat-icon.purple { background: rgba(127, 0, 255, 0.15); color: #c084fc; }
        .stat-icon.amber { background: rgba(255, 170, 0, 0.15); color: var(--accent-amber); }

        .stat-content h3 {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .stat-content p {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Main Section Layout */
        .dashboard-main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 14px;
        }

        @media (max-width: 1024px) {
            .dashboard-main { grid-template-columns: 1fr; }
        }

        /* Card Box */
        .card-box {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 16px;
            backdrop-filter: blur(12px);
        }

        .box-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .box-title {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .accounts-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .account-card {
            background: rgba(10, 15, 30, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 12px 14px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .account-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
        }

        .acc-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .acc-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .acc-avatar {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, #1e293b, #334155);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .acc-info h4 {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .region-badge {
            background: rgba(255, 255, 255, 0.08);
            color: #a5b4fc;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
        }

        .acc-info span {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .acc-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 14px;
        }

        .status-online {
            background: rgba(0, 255, 136, 0.12);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.25);
        }

        .status-match {
            background: rgba(0, 242, 254, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.4);
            animation: pulse-border 1.5s infinite alternate;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(0, 242, 254, 0.3); }
            100% { border-color: rgba(0, 242, 254, 0.8); }
        }

        /* EXP Box */
        .exp-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            background: rgba(0, 0, 0, 0.28);
            padding: 8px 12px;
            border-radius: 9px;
            margin-bottom: 10px;
        }

        .exp-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .exp-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .exp-val {
            font-size: 13px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
        }

        .exp-gained {
            color: var(--accent-green) !important;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .gained-badge {
            background: rgba(0, 255, 136, 0.16);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        /* Level Progress Bar */
        .level-progress {
            margin-bottom: 10px;
        }

        .level-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .progress-bar-bg {
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
            border-radius: 8px;
            transition: width 0.5s ease;
        }

        .acc-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            color: var(--text-muted);
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
        }

        .icon-btn:hover {
            background: rgba(0, 242, 254, 0.15);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .icon-btn.danger:hover {
            background: rgba(255, 51, 102, 0.15);
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        /* Live Logs Stream */
        .logs-box {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .log-stream {
            flex: 1;
            min-height: 350px;
            max-height: 480px;
            background: #03060f;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-stream::-webkit-scrollbar {
            width: 5px;
        }

        .log-stream::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .log-item {
            line-height: 1.3;
            word-break: break-all;
        }

        .log-time { color: #64748b; margin-right: 5px; }
        .log-info { color: #38bdf8; }
        .log-success { color: #4ade80; }
        .log-warning { color: #fbbf24; }
        .log-error { color: #f87171; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 6, 15, 0.82);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: #0c1224;
            border: 1px solid var(--border-card);
            border-radius: 14px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent-cyan);
        }

        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 36px;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="logo-box">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="brand-text">
                    <h1>MAHIR LW | LEVEL UP BOT <span style="font-weight:400; color:var(--text-muted); font-size:13px;"></span></h1>
                    <p>
                        <span class="live-tag"><span class="pulse-dot"></span> System Live</span>
                        <span>• Safe Multi-Match</span>
                    </p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="fetchStats()"><i class="fa-solid fa-rotate"></i> Refresh</button>
                <button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add Account</button>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon cyan"><i class="fa-solid fa-users"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-accounts">0</h3>
                    <p>Active Accounts</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fa-solid fa-angles-up"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-exp" style="color:var(--accent-green)">+0 EXP</h3>
                    <p>Total EXP Gained</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fa-solid fa-gamepad"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-matches">0</h3>
                    <p>Matches Completed</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon amber"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="stat-content">
                    <h3 id="stat-uptime">00:00:00</h3>
                    <p>Bot Uptime</p>
                </div>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div class="dashboard-main">
            <!-- Accounts List -->
            <div class="card-box">
                <div class="box-header">
                    <div class="box-title">
                        <i class="fa-solid fa-user-astronaut" style="color:var(--accent-cyan)"></i>
                        <span>Live Accounts & EXP Monitor</span>
                    </div>
                </div>
                <div class="accounts-list" id="accounts-container">
                    <div class="empty-state">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                        <p>Loading active accounts...</p>
                    </div>
                </div>
            </div>

            <!-- Real-time Logs -->
            <div class="card-box logs-box">
                <div class="box-header">
                    <div class="box-title">
                        <i class="fa-solid fa-terminal" style="color:var(--accent-green)"></i>
                        <span>Live Match & Bot Logs</span>
                    </div>
                    <span style="font-size:11px; color:var(--text-muted);">Real-time</span>
                </div>
                <div class="log-stream" id="log-stream">
                    <!-- Logs inserted dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Account Modal -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-plus" style="color:var(--accent-cyan); margin-right:6px;"></i> Add New Account</h3>
                <button class="icon-btn" onclick="closeAddModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="add-acc-form" onsubmit="submitAddAccount(event)">
                <div class="form-group">
                    <label>Account Type</label>
                    <select class="form-input" id="acc-type" onchange="toggleFormType()">
                        <option value="guest">Guest Account (UID + Password)</option>
                        <option value="token">Access Token</option>
                    </select>
                </div>
                <div id="guest-fields">
                    <div class="form-group">
                        <label>Guest UID</label>
                        <input type="text" class="form-input" id="acc-uid" placeholder="e.g. 7644913583">
                    </div>
                    <div class="form-group">
                        <label>Guest Password / Secret</label>
                        <input type="text" class="form-input" id="acc-password" placeholder="e.g. ZERO_GRAVITY_4NM38">
                    </div>
                </div>
                <div id="token-fields" style="display:none;">
                    <div class="form-group">
                        <label>Access Token</label>
                        <textarea class="form-input" id="acc-token" rows="3" placeholder="Paste access token here..."></textarea>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Save & Start</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let startTime = Date.now();

        function openAddModal() {
            document.getElementById('add-modal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('active');
        }

        function toggleFormType() {
            const type = document.getElementById('acc-type').value;
            document.getElementById('guest-fields').style.display = type === 'guest' ? 'block' : 'none';
            document.getElementById('token-fields').style.display = type === 'token' ? 'block' : 'none';
        }

        async function submitAddAccount(e) {
            e.preventDefault();
            const type = document.getElementById('acc-type').value;
            let payload = {};
            if (type === 'guest') {
                const uid = document.getElementById('acc-uid').value.trim();
                const password = document.getElementById('acc-password').value.trim();
                if (!uid || !password) return alert('Please enter both UID and Password');
                payload = { uid, password };
            } else {
                const token = document.getElementById('acc-token').value.trim();
                if (!token) return alert('Please enter token');
                payload = { token };
            }

            try {
                const res = await fetch('/api/account/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    closeAddModal();
                    document.getElementById('add-acc-form').reset();
                    fetchStats();
                } else {
                    alert('Error adding account: ' + (data.error || 'Unknown'));
                }
            } catch (err) {
                alert('Request failed: ' + err);
            }
        }

        async function deleteAccount(uid) {
            if (!confirm('Are you sure you want to remove account ' + uid + '?')) return;
            try {
                const res = await fetch('/api/account/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                fetchStats();
            } catch (err) {
                console.error(err);
            }
        }

        async function refreshAccountInfo(uid) {
            try {
                await fetch('/api/account/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                fetchStats();
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                document.getElementById('stat-total-accounts').innerText = data.total_accounts;
                document.getElementById('stat-total-exp').innerText = '+' + data.total_gained_exp.toLocaleString() + ' EXP';
                document.getElementById('stat-total-matches').innerText = data.total_matches;

                // Render Accounts
                const container = document.getElementById('accounts-container');
                if (data.accounts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-ghost"></i>
                            <p>No active accounts running. Click "+ Add Account" to start!</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = data.accounts.map(acc => {
                        const gainedExp = acc.gained_exp || 0;
                        const statusClass = acc.status === 'IN_MATCH' ? 'status-match' : 'status-online';
                        const statusText = acc.status === 'IN_MATCH' ? `In Match (${acc.active_matches} active)` : acc.status;
                        
                        return `
                            <div class="account-card">
                                <div class="acc-top">
                                    <div class="acc-profile">
                                        <div class="acc-avatar"><i class="fa-solid fa-user"></i></div>
                                        <div class="acc-info">
                                            <h4>${escapeHtml(acc.nickname)} <span class="region-badge">${acc.region || 'BD'}</span></h4>
                                            <span>UID: ${acc.uid}</span>
                                        </div>
                                    </div>
                                    <div class="acc-status ${statusClass}">
                                        <span class="pulse-dot"></span>
                                        <span>${statusText}</span>
                                    </div>
                                </div>

                                <div class="exp-box">
                                    <div class="exp-item">
                                        <span class="exp-label">Initial EXP</span>
                                        <span class="exp-val">${acc.initial_exp.toLocaleString()}</span>
                                    </div>
                                    <div class="exp-item">
                                        <span class="exp-label">Current EXP</span>
                                        <span class="exp-val">${acc.current_exp.toLocaleString()}</span>
                                    </div>
                                    <div class="exp-item">
                                        <span class="exp-label">EXP Gained</span>
                                        <span class="exp-val exp-gained">
                                            <span class="gained-badge">+${gainedExp.toLocaleString()} EXP</span>
                                        </span>
                                    </div>
                                </div>

                                <div class="level-progress">
                                    <div class="level-labels">
                                        <span style="color:var(--accent-cyan)">Level ${acc.level}</span>
                                        <span style="color:var(--text-muted)">Matches: ${acc.matches_played}</span>
                                    </div>
                                    <div class="progress-bar-bg">
                                        <div class="progress-bar-fill" style="width: ${Math.min(100, Math.max(15, (acc.current_exp % 1000) / 10))}%"></div>
                                    </div>
                                </div>

                                <div class="acc-actions">
                                    <span>Last match: ${acc.last_match_time || 'Running...'}</span>
                                    <div class="action-btns">
                                        <button class="icon-btn" title="Refresh Profile/EXP" onclick="refreshAccountInfo('${acc.uid}')"><i class="fa-solid fa-rotate"></i></button>
                                        <button class="icon-btn danger" title="Delete Account" onclick="deleteAccount('${acc.uid}')"><link rel="stylesheet" href="..."><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // Render Logs
                const logContainer = document.getElementById('log-stream');
                logContainer.innerHTML = data.logs.map(log => {
                    return `<div class="log-item"><span class="log-time">[${log.time}]</span><span class="log-${log.level}">${escapeHtml(log.message)}</span></div>`;
                }).join('');
                logContainer.scrollTop = logContainer.scrollHeight;

            } catch (err) {
                console.error("Failed to fetch stats:", err);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Uptime counter
        setInterval(() => {
            const sec = Math.floor((Date.now() - startTime) / 1000);
            const h = String(Math.floor(sec / 3600)).padStart(2, '0');
            const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            document.getElementById('stat-uptime').innerText = `${h}:${m}:${s}`;
        }, 1000);

        // Live Poll every 2.5s
        fetchStats();
        setInterval(fetchStats, 2500);
    </script>
</body>
</html>
